
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest -q

  docker:
    name: Build and scan Docker image
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
              - name: Checkout repository
                uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
              - name: Set up Docker Buildx
                uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435
              - name: Log in to GHCR
                uses: docker/login-action@184bdaa0721073962dff0199f1fb9940f07167d1
                with:
                 registry: ghcr.io
                 username: ${{ github.actor }}
                 password: ${{ secrets.GITHUB_TOKEN }}
              - name: Build Docker image
                run: docker build -t churn-api:${{ github.sha }} .
              - name: Scan Docker image with Trivy
                run: |
                 docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.67.2 image --exit-code 1 --severity HIGH,CRITICAL churn-api:${{ github.sha }}
              - name: Tag and push Docker image to GHCR
                run: |
                    IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}
                     docker tag churn-api:${GITHUB_SHA} "$IMAGE"
                      docker push "$IMAGE"